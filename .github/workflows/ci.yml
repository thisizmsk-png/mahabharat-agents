name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Validate YAML orchestration files
        run: |
          python -c "
          import pathlib, sys, yaml

          errors = []
          yaml_dir = pathlib.Path('orchestration')
          if not yaml_dir.exists():
              print('No orchestration/ directory found, skipping YAML validation.')
              sys.exit(0)

          for f in sorted(yaml_dir.rglob('*.yaml')):
              try:
                  yaml.safe_load(f.read_text())
                  print(f'  OK: {f}')
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')
                  print(f'  FAIL: {f}')

          for f in sorted(yaml_dir.rglob('*.yml')):
              try:
                  yaml.safe_load(f.read_text())
                  print(f'  OK: {f}')
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')
                  print(f'  FAIL: {f}')

          if errors:
              print('\nYAML validation failures:')
              for err in errors:
                  print(f'  - {err}')
              sys.exit(1)
          else:
              print('\nAll YAML files valid.')
          "

      # Agent frontmatter, the x-mahabharat schema and the roster manifest are
      # validated by tests/test_agents.py (spec/mahabharat.agent.v1.schema.json).
      - name: Run tests
        run: pytest

  smoke:
    # Stage 0 smoke test: real Claude Code CLI, no credentials, $0. It stops at
    # "Not logged in" after emitting system/init and the agent-parse debug lines.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Claude Code CLI
        # Pinned to the version the plan's spike verified; bump deliberately.
        run: npm install -g @anthropic-ai/claude-code@2.1.295

      - name: Smoke test (fixture project, scripts/install.sh --from HEAD)
        env:
          CLAUDE_BIN: claude
        run: scripts/smoke.sh
