[project]
name = "mahabharat-agents"
version = "0.1.1"
description = "One person. One AI company. Infinite leverage. Deploy FAANG-level AI agents named after Mahabharata characters to run your software company."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sai Krishna Madavarapu", email = "msaikrishna399@gmail.com"}
]
keywords = [
    "ai-agents",
    "multi-agent",
    "claude-code",
    "mahabharata",
    "software-company",
    "orchestration",
    "llm-agents",
    "solo-builder"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyyaml>=6.0",
    "jsonschema>=4.18",
]

[project.urls]
Homepage = "https://github.com/thisizmsk-png/mahabharat-agents"
Repository = "https://github.com/thisizmsk-png/mahabharat-agents"
Issues = "https://github.com/thisizmsk-png/mahabharat-agents/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
mahabharat-install = "mahabharat_agents.cli:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mahabharat_agents"]

# Only installable content is bundled. agents/ holds roster.yaml plus the agent
# files it lists; the sepoy template lives in templates/ and is never bundled or installed.
# orchestration/ and context/ are not bundled: those pre-v1 docs predate the owner-only
# approval model, and the CLI no longer installs them.
[tool.hatch.build.targets.wheel.force-include]
"agents" = "mahabharat_agents/data/agents"
"skills" = "mahabharat_agents/data/skills"

[tool.hatch.build.targets.sdist]
exclude = ["docs/research", "dist", "**/__pycache__"]
